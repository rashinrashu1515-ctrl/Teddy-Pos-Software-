  <!-- Supabase Auth Client SDK (Inline) -->
  <script>
    (function () {
      const SUPABASE_URL = window.ENV_SUPABASE_URL || 'https://your-project.supabase.co';
      const SUPABASE_ANON_KEY = window.ENV_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.your-anon-key';
      const GET_REDIRECT_URL = () => window.ENV_REDIRECT_URL || (window.location.origin + window.location.pathname);

      let clientInstance = null;
      let currentSession = null;
      let currentUserProfile = null;
      let authListeners = [];

      function getSupabase() {
        if (!clientInstance && window.supabase && typeof window.supabase.createClient === 'function') {
          try {
            clientInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
              auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
            });
          } catch (e) { console.warn('TeddyAuth init error:', e); }
        }
        return clientInstance;
      }

      function isConfigured() {
        return (SUPABASE_URL && !SUPABASE_URL.includes('your-project') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('your-anon-key'));
      }

      const authService = {
        async sendEmailOtp(email) {
          const sb = getSupabase();
          if (!sb || !isConfigured()) return { ok: false, isDemo: true, message: 'Supabase credentials not configured.' };
          try {
            const { data, error } = await sb.auth.signInWithOtp({ email: email.trim().toLowerCase(), options: { shouldCreateUser: true, emailRedirectTo: GET_REDIRECT_URL() } });
            if (error) return { ok: false, message: error.message };
            return { ok: true, data, message: `Verification code sent to ${email}` };
          } catch (err) { return { ok: false, message: err.message || 'Network error.' }; }
        },
        async verifyEmailOtp(email, otpToken) {
          const sb = getSupabase();
          if (!sb || !isConfigured()) return { ok: false, isDemo: true, message: 'Supabase credentials not configured.' };
          try {
            const { data, error } = await sb.auth.verifyOtp({ email: email.trim().toLowerCase(), token: otpToken.trim(), type: 'email' });
            if (error) return { ok: false, message: error.message };
            currentSession = data.session;
            if (data.user) { currentUserProfile = await profileService.fetchUserProfile(data.user.id); }
            notifyListeners('SIGNED_IN', data.session);
            return { ok: true, session: data.session, user: data.user, profile: currentUserProfile };
          } catch (err) { return { ok: false, message: err.message || 'OTP verification failed.' }; }
        },
        async loginWithGoogle() {
          const sb = getSupabase();
          if (!sb || !isConfigured()) return { ok: false, isDemo: true };
          try {
            const { data, error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: GET_REDIRECT_URL() } });
            if (error) throw error;
            return { ok: true, data };
          } catch (err) { alert('Google Sign-In Error: ' + err.message); return { ok: false, message: err.message }; }
        },
        async signOut() {
          const sb = getSupabase();
          if (sb) { try { await sb.auth.signOut(); } catch (e) {} }
          currentSession = null; currentUserProfile = null;
          safeRemoveStorage('teddy-user', true); safeRemoveStorage('muzu-user', true);
          notifyListeners('SIGNED_OUT', null);
        }
      };

      const profileService = {
        async fetchUserProfile(userId) {
          const sb = getSupabase();
          if (!sb || !userId) return null;
          try {
            const { data, error } = await sb.from('profiles').select('*, businesses(*)').eq('id', userId).maybeSingle();
            if (error) return null;
            return data;
          } catch (err) { return null; }
        }
      };

      function initSessionListener(onStateChangedCallback) {
        if (typeof onStateChangedCallback === 'function') authListeners.push(onStateChangedCallback);
        const sb = getSupabase();
        if (!sb) return;
        sb.auth.onAuthStateChange(async (event, session) => {
          currentSession = session;
          if (session && session.user) currentUserProfile = await profileService.fetchUserProfile(session.user.id);
          else currentUserProfile = null;
          notifyListeners(event, session);
        });
        sb.auth.getSession().then(async ({ data: { session } }) => {
          currentSession = session;
          if (session && session.user) {
            currentUserProfile = await profileService.fetchUserProfile(session.user.id);
            notifyListeners('INITIAL_SESSION', session);
          }
        });
      }

      function notifyListeners(event, session) {
        authListeners.forEach(fn => { try { fn(event, session, currentUserProfile); } catch (e) {} });
      }

      window.TeddyAuth = {
        getSupabase, isConfigured,
        sendEmailOtp: authService.sendEmailOtp, verifyEmailOtp: authService.verifyEmailOtp,
        loginWithGoogle: authService.loginWithGoogle, signOut: authService.signOut,
        fetchUserProfile: profileService.fetchUserProfile, initSessionListener,
        getCurrentSession: () => currentSession, getCurrentProfile: () => currentUserProfile
      };
      window.TeddySupabase = window.TeddyAuth;
    })();
  </script>

  <!-- Firebase App & Services (teddyflow-41159) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>

  <!-- Firebase Client SDK (Inline) -->
  <script>
    (function () {
      const firebaseConfig = {
        apiKey: "AIzaSyC4UtT-Wui2dxDySQG-ANmmXWFS43uCUug",
        authDomain: "teddyflow-41159.firebaseapp.com",
        projectId: "teddyflow-41159",
        storageBucket: "teddyflow-41159.firebasestorage.app",
        messagingSenderId: "349167641030",
        appId: "1:349167641030:web:e27cfe1b2925d4fbeed2c7",
        measurementId: "G-4M1XV51XHY"
      };

      let firebaseApp = null;
      let firebaseAuth = null;
      let firestoreDb = null;
      let phoneConfirmationResult = null;
      let recaptchaVerifier = null;

      function initFirebase() {
        if (!firebaseApp && window.firebase && typeof window.firebase.initializeApp === 'function') {
          try {
            firebaseApp = window.firebase.initializeApp(firebaseConfig);
            if (window.firebase.auth) firebaseAuth = window.firebase.auth();
            if (window.firebase.firestore) firestoreDb = window.firebase.firestore();
            console.log("🔥 Teddy Software POS: Firebase initialized (Project: teddyflow-41159)");
          } catch (err) { if (!/already exists/i.test(err.message)) console.warn("Firebase init:", err.message); }
        }
        return firebaseApp;
      }

      if (window.firebase) initFirebase();
      else document.addEventListener("DOMContentLoaded", initFirebase);

      async function signInWithGoogleFirebase(options = {}) {
        initFirebase();
        if (!firebaseAuth) return { ok: false, code: "auth/sdk-not-loaded", message: "Firebase Auth SDK is loading. Try again in a few seconds." };
        const currentHostname = window.location.hostname || "localhost";
        const provider = new window.firebase.auth.GoogleAuthProvider();
        provider.addScope("email"); provider.addScope("profile");
        provider.setCustomParameters({ prompt: "select_account" });

        try {
          const result = await firebaseAuth.signInWithPopup(provider);
          const user = result.user;
          await syncUserProfile(user);
          return { ok: true, user: { id: user.uid, uid: user.uid, email: user.email, name: user.displayName || user.email.split("@")[0], photoUrl: user.photoURL || "", provider: "google.com" } };
        } catch (err) {
          if (err.code === "auth/popup-blocked" || options.useRedirect) {
            try {
              await firebaseAuth.signInWithRedirect(provider);
              return { ok: false, isRedirecting: true, message: "Redirecting to Google Sign-In..." };
            } catch (redirectErr) { return handleAuthError(redirectErr, currentHostname); }
          }
          return handleAuthError(err, currentHostname);
        }
      }

      async function signInWithEmailAndPassword(email, password) {
        initFirebase();
        if (!firebaseAuth) return { ok: false, message: "Firebase Auth SDK not ready." };
        try {
          const userCredential = await firebaseAuth.signInWithEmailAndPassword(email.trim(), password);
          const user = userCredential.user;
          await syncUserProfile(user);
          return { ok: true, user: { id: user.uid, uid: user.uid, email: user.email, name: user.displayName || user.email.split("@")[0], photoUrl: user.photoURL || "" } };
        } catch (err) { return handleAuthError(err, window.location.hostname); }
      }

      async function createUserWithEmailAndPassword(email, password, displayName = "") {
        initFirebase();
        if (!firebaseAuth) return { ok: false, message: "Firebase Auth SDK not ready." };
        try {
          const userCredential = await firebaseAuth.createUserWithEmailAndPassword(email.trim(), password);
          const user = userCredential.user;
          if (displayName) await user.updateProfile({ displayName: displayName });
          await syncUserProfile(user);
          return { ok: true, user: { id: user.uid, uid: user.uid, email: user.email, name: displayName || user.email.split("@")[0], photoUrl: user.photoURL || "" } };
        } catch (err) { return handleAuthError(err, window.location.hostname); }
      }

      async function sendPasswordResetEmail(email) {
        initFirebase();
        if (!firebaseAuth) return { ok: false, message: "Firebase Auth SDK not ready." };
        try {
          await firebaseAuth.sendPasswordResetEmail(email.trim());
          return { ok: true, message: `Password reset email sent to ${email}` };
        } catch (err) { return handleAuthError(err, window.location.hostname); }
      }

      function initPhoneRecaptcha(containerId = "recaptcha-container") {
        initFirebase();
        if (!firebaseAuth) return null;
        try {
          if (!recaptchaVerifier) {
            recaptchaVerifier = new window.firebase.auth.RecaptchaVerifier(containerId, { size: "invisible" });
          }
          return recaptchaVerifier;
        } catch (err) { return null; }
      }

      async function sendPhoneVerificationCode(phoneNumber, containerId = "recaptcha-container") {
        initFirebase();
        if (!firebaseAuth) return { ok: false, message: "Firebase Auth SDK not ready." };
        const formattedPhone = phoneNumber.startsWith("+") ? phoneNumber : `+91${phoneNumber.replace(/\D/g, "")}`;
        try {
          const verifier = initPhoneRecaptcha(containerId);
          phoneConfirmationResult = await firebaseAuth.signInWithPhoneNumber(formattedPhone, verifier);
          return { ok: true, message: `SMS verification code sent to ${formattedPhone}`, confirmationResult: phoneConfirmationResult };
        } catch (err) { return handleAuthError(err, window.location.hostname); }
      }

      async function verifyPhoneOtpCode(otpCode) {
        if (!phoneConfirmationResult) return { ok: false, message: "No active SMS verification session. Request code first." };
        try {
          const userCredential = await phoneConfirmationResult.confirm(otpCode.trim());
          const user = userCredential.user;
          await syncUserProfile(user);
          return { ok: true, user: { id: user.uid, uid: user.uid, phoneNumber: user.phoneNumber, name: user.displayName || user.phoneNumber, email: user.email || `${user.phoneNumber}@teddypos.local` } };
        } catch (err) { return handleAuthError(err, window.location.hostname); }
      }

      async function checkGoogleRedirectResult() {
        initFirebase();
        if (!firebaseAuth) return null;
        try {
          const result = await firebaseAuth.getRedirectResult();
          if (result && result.user) {
            const user = result.user;
            await syncUserProfile(user);
            return { ok: true, user: { id: user.uid, uid: user.uid, email: user.email, name: user.displayName || user.email.split("@")[0], photoUrl: user.photoURL || "", provider: "google.com" } };
          }
        } catch (err) {}
        return null;
      }

      async function syncUserProfile(user) {
        initFirebase();
        if (!firestoreDb || !user) return;
        try {
          const userRef = firestoreDb.collection("users").doc(user.uid);
          await userRef.set({ uid: user.uid, email: user.email || "", phoneNumber: user.phoneNumber || "", displayName: user.displayName || (user.email ? user.email.split("@")[0] : user.phoneNumber || "User"), photoURL: user.photoURL || "", role: "admin", accountStatus: "active", lastLoginAt: window.firebase.firestore.FieldValue.serverTimestamp(), updatedAt: window.firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        } catch (err) {}
      }

      async function saveOrderToFirestore(orderData) {
        initFirebase();
        if (!firestoreDb) return { ok: false, message: "Firestore not initialized." };
        try {
          const docRef = await firestoreDb.collection("orders").add({ ...orderData, createdAt: window.firebase.firestore.FieldValue.serverTimestamp() });
          return { ok: true, orderId: docRef.id };
        } catch (err) { return { ok: false, message: err.message }; }
      }

      function handleAuthError(err, hostname) {
        const code = err.code || "";
        let userMessage = "Authentication failed. Please try again.";
        if (code === "auth/popup-closed-by-user") userMessage = "Google Sign-In was cancelled. Click 'Continue with Google' to try again.";
        else if (code === "auth/unauthorized-domain") userMessage = `Domain '${hostname}' is not authorized in Firebase Console.\nGo to Firebase Console -> Authentication -> Settings -> Authorized domains and add '${hostname}'.`;
        else if (code === "auth/operation-not-allowed") userMessage = "Selected sign-in method is disabled in Firebase Console.";
        else if (code === "auth/wrong-password" || code === "auth/user-not-found") userMessage = "Invalid email or password.";
        else if (code === "auth/email-already-in-use") userMessage = "An account already exists with this email address.";
        else if (code === "auth/invalid-phone-number") userMessage = "Please enter a valid phone number with country code.";
        else if (code === "auth/invalid-verification-code") userMessage = "Invalid SMS verification code.";
        else if (err.message) userMessage = err.message;
        return { ok: false, code: code, message: userMessage, rawError: err };
      }

      async function firebaseSignOut() {
        if (firebaseAuth) await firebaseAuth.signOut();
        try { safeRemoveStorage("teddy-user", true); } catch (e) {}
      }

      function onFirebaseAuthStateChanged(callback) {
        initFirebase();
        if (firebaseAuth) {
          return firebaseAuth.onAuthStateChanged(async (user) => {
            if (user) await syncUserProfile(user);
            if (typeof callback === "function") callback(user);
          });
        }
      }

      function getDiagnostics() {
        initFirebase();
        return { hostname: window.location.hostname, projectId: firebaseConfig.projectId, appId: firebaseConfig.appId, authDomain: firebaseConfig.authDomain, initialized: !!firebaseApp, authReady: !!firebaseAuth, dbReady: !!firestoreDb, currentUser: firebaseAuth ? (firebaseAuth.currentUser ? firebaseAuth.currentUser.email || firebaseAuth.currentUser.phoneNumber : null) : null };
      }

      window.TeddyFirebase = {
        config: firebaseConfig, initFirebase, getApp: () => firebaseApp || initFirebase(), getAuth: () => firebaseAuth, getDb: () => firestoreDb,
        loginWithGoogle: signInWithGoogleFirebase, signInWithGoogle: signInWithGoogleFirebase,
        signInWithEmail: signInWithEmailAndPassword, signUpWithEmail: createUserWithEmailAndPassword, sendPasswordReset: sendPasswordResetEmail,
        sendPhoneCode: sendPhoneVerificationCode, verifyPhoneCode: verifyPhoneOtpCode, checkGoogleRedirectResult,
        saveOrderToFirestore, syncUserProfile, signOut: firebaseSignOut, onAuthStateChanged: onFirebaseAuthStateChanged, getDiagnostics
      };
    })();
  </script>

    function openImageDb() {
      if (!('indexedDB' in window)) return Promise.reject(new Error('Photo storage is not available in this browser.'));
      if (!imageDbPromise) {
        imageDbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(IMAGE_DB_NAME, 1);
          request.onupgradeneeded = () => {
            const dbInstance = request.result;
            if (!dbInstance.objectStoreNames.contains(IMAGE_STORE_NAME)) dbInstance.createObjectStore(IMAGE_STORE_NAME);
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Could not open photo storage.'));
        });
      }
      return imageDbPromise;
    }
    async function imageStore(mode, action) {
      const imageDb = await openImageDb();
      return new Promise((resolve, reject) => {
        const tx = imageDb.transaction(IMAGE_STORE_NAME, mode);
        const store = tx.objectStore(IMAGE_STORE_NAME);
        const request = action(store);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Photo storage failed.'));
      });
    }

    function hashValue(val) {

    function render() {

      if (page === 'menu') renderMenu();
      if (page === 'tables') renderTables();
      if (page === 'reports' || page === 'sales') renderReports();

      if (page === 'settings') renderSettings();

    function resizeLocalImage(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          reject(new Error('Please choose an image file.'));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Could not read this image.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Could not open this image.'));
          img.onload = () => {
            const max = 520;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.74));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function inventoryBaseUnit(unit) {

    function amountToBase(value, unit) {
      const amount = Math.max(0, Number(value) || 0);
      if (unit === 'kg' || unit === 'l') return Math.round(amount * 1000);
      if (unit === 'g' || unit === 'ml') return Math.round(amount);
      return Math.round(amount);
    }
    function baseToAmount(value, unit) {
      const amount = Math.max(0, Number(value) || 0);
      if (unit === 'kg' || unit === 'l') return amount / 1000;
      return amount;

      if (baseUnit === 'ml') return value >= 1000 ? `${prettyNumber(value / 1000)} l (${Math.round(value)} ml)` : `${Math.round(value)} ml`;
      return `${Math.round(value)} pcs`;

    function minutesSince(value) {

    function addInventoryItem() {
      const name = document.getElementById('invName')?.value.trim();
      const unit = document.getElementById('invUnit')?.value || 'kg';
      const stock = Math.max(0, Number(document.getElementById('invStock')?.value) || 0);
      const min = Math.max(0, Number(document.getElementById('invMin')?.value) || 0);
      const usage = Math.max(0, Number(document.getElementById('invUsage')?.value) || 0);
      if (!name) return toast('Enter stock item name.');
      const existing = db.inventory.find(i => i.name.toLowerCase() === name.toLowerCase());
      if (existing) {
        existing.unit = unit;
        existing.baseUnit = inventoryBaseUnit(unit);
        existing.stockBase = (Number(existing.stockBase)||0) + amountToBase(stock, unit);
        existing.minBase = amountToBase(min, unit);
        existing.usageBase = amountToBase(usage, unit);
        syncInventoryLegacy(existing);
      } else {
        const item = { id: 'inv' + Date.now(), name, unit, baseUnit: inventoryBaseUnit(unit), stockBase: amountToBase(stock, unit), minBase: amountToBase(min, unit), usageBase: amountToBase(usage, unit) };
        syncInventoryLegacy(item);
        db.inventory.unshift(item);
      }
      save();
      toast(`${name} stock saved.`);
      renderInventory();

    function adjustInventory(id, delta) {
      const item = db.inventory.find(i => i.id === id);
      if (!item) return;
      const step = item.baseUnit === 'g' || item.baseUnit === 'ml' ? delta : Math.sign(delta);
      item.stockBase = Math.max(0, (Number(item.stockBase)||0) + step);
      syncInventoryLegacy(item);
      save();
      if (Number(item.stockBase) <= Number(item.minBase)) toast(`Shortage alert: ${item.name} has ${formatInventoryQty(item.stockBase, item.baseUnit)} left.`);
      renderInventory();
    }

    function reportStats() {

      return {

        paid,
        unpaid,
        todayRevenue: todayOrders.reduce((a,o)=>a+o.total,0),

      };

    function aggregateItems(orders) {
      const map = new Map();
      orders.forEach(o => o.items.forEach(i => {
        const key = i.name;
        const row = map.get(key) || { label: i.name, qty: 0, revenue: 0 };
        row.qty += Number(i.qty) || 0;
        row.revenue += (Number(i.price)||0) * (Number(i.qty)||0);
        map.set(key, row);
      }));
      return [...map.values()].sort((a,b)=>b.qty-a.qty || b.revenue-a.revenue);
    }
    function aggregateCategories(orders) {
      const map = new Map();
      orders.forEach(o => o.items.forEach(i => {
        const key = i.category || 'Other';
        const row = map.get(key) || { label: key, qty: 0, revenue: 0 };
        row.qty += Number(i.qty) || 0;
        row.revenue += (Number(i.price)||0) * (Number(i.qty)||0);
        map.set(key, row);
      }));
      return [...map.values()].sort((a,b)=>b.revenue-a.revenue);
    }
    function barRows(rows, key, formatValue) {

      return rows.slice(0,6).map(r => {
        const value = Number(r[key]) || 0;
        const width = Math.max(5, Math.round((value / max) * 100));
        return `<div class="bar-row"><strong>${esc(r.label)}</strong><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><b>${formatValue(value, r)}</b></div>`;

            <strong style="font-size: 24px; color: var(--purple-light);">₹${plan.price}</strong>
          </div>
        </div>
        <div class="qr-card">
          <div class="qr-img-wrap">
            <img src="${qrUrl}" alt="UPI QR Code" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'200\\' height=\\'200\\'><rect width=\\'200\\' height=\\'200\\' fill=\\'%23ffffff\\'/><text x=\\'50%\\' y=\\'50%\\' text-anchor=\\'middle\\' fill=\\'%23000\\'>Scan %26 Pay ₹${plan.price}</text></svg>'">
          </div>
          <div>
            <p class="eyebrow">Scan & Pay via any UPI App</p>
            <h3 style="margin: 4px 0 8px;">GPay, PhonePe, Paytm, BHIM</h3>
            <p style="color:var(--muted);font-size:13px;margin-bottom:10px;">Scan the QR code or pay directly to the UPI details below:</p>
            <div style="background:rgba(15,23,42,0.9);padding:10px;border-radius:10px;border:1px solid var(--line);margin-bottom:8px;">
              <small style="color:var(--muted);display:block;">UPI ID / VPA</small>
              <strong style="font-size:16px;color:#fff;">${upiId}</strong>
            </div>
            <div style="background:rgba(15,23,42,0.9);padding:10px;border-radius:10px;border:1px solid var(--line);">
              <small style="color:var(--muted);display:block;">UPI Number</small>
              <strong style="font-size:16px;color:#fff;">${upiNumber}</strong>
            </div>
          </div>
        </div>
        <form style="margin-top: 18px; display: grid; gap: 12px;" onsubmit="event.preventDefault(); submitPayment('${plan.name}', ${plan.price});">
          <label>Transaction UTR / Reference Number (12 digits)
            <input id="payUtr" required placeholder="e.g. 428912345678" pattern="[0-9A-Za-z]{6,20}" autocomplete="off">
          </label>
          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="ghost" type="button" onclick="this.closest('.modal').remove()">Cancel</button>
            <button class="primary" type="submit">I Have Completed Payment</button>
          </div>
        </form>
      </div>`;
      document.body.appendChild(div);
    }
    function submitPayment(planName, price) {
      const utr = document.getElementById('payUtr').value.trim();
      if (!utr) return toast('Please enter the 12-digit UTR number.');
      db.paymentRequests ||= [];
      const req = {
        id: 'pay-' + Date.now(),
        planName,
        price,
        utr,
        createdAt: now(),
        status: 'Pending Verification',
        username: user?.username || 'admin'
      };
      db.paymentRequests.unshift(req);
      db.subscription.status = 'pending';
      db.subscription.requestedPlan = planName;
      save();
      document.getElementById('checkoutModal')?.remove();
      toast('Payment submitted! Status: Pending Verification.');
      beep();
      renderPlans();
    }
    function renderSubscribers() {
      const ws = document.getElementById('workspace');
      if (user?.role !== 'admin') {
        ws.innerHTML = '<section class="panel"><p class="empty">Access denied. Owner Admin only.</p></section>';
        return;
      }
      const requests = db.paymentRequests || [];
      const plans = db.plans || seedPlans();
      const sub = db.subscription || {};

      ws.innerHTML = `
      <section class="panel">
        <div class="section-head">
          <div><p class="eyebrow">Subscriber Management & Verification</p><h2>Subscription Requests & Admin Portal</h2><small style="color:var(--muted)">Review UTR submissions, approve plans, set expiry dates, and edit pricing.</small></div>
        </div>

        <div style="margin-bottom: 24px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(30, 27, 75, 0.4);">
          <h3>Active Subscription State</h3>
          <div class="grid3" style="margin-top: 12px;">
            <div class="metric"><span>Active Plan</span><b>${sub.activePlan}</b></div>
            <div class="metric"><span>Status</span><b>${sub.status}</b></div>
            <div class="metric"><span>Expires At</span><b style="font-size:18px;">${time(sub.expiresAt)}</b></div>
          </div>
        </div>

        <div style="margin-bottom: 24px;">
          <h3>Payment Verification Queue (UTR Submissions)</h3>
          <div class="list" style="margin-top: 12px;">
            ${requests.map(r => `
              <div class="row" style="grid-template-columns: 1fr auto auto;">
                <div>
                  <strong>${r.planName} Plan - ₹${r.price}</strong>
                  <small>UTR: <b style="color:#a7f3d0">${r.utr}</b> | Submitted by: ${r.username} | Date: ${time(r.createdAt)}</small>
                </div>
                <span class="status ${r.status === 'Approved' ? 'Ready' : r.status === 'Rejected' ? 'New' : 'Preparing'}">${r.status}</span>
                ${r.status === 'Pending Verification' ? `
                  <div style="display:flex; gap:8px;">
                    <button class="primary" onclick="approvePayment('${r.id}')">Approve & Activate</button>
                    <button class="danger" onclick="rejectPayment('${r.id}')">Reject</button>
                  </div>
                ` : ''}
              </div>
            `).join('') || '<p class="empty">No payment verification requests yet.</p>'}
          </div>
        </div>

        <div style="padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(15, 23, 42, 0.8);">
          <h3>Plan Pricing Configurator</h3>
          <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Edit plan pricing dynamically without code changes.</p>
          <div class="plans-grid">
            ${plans.map(p => `
              <div class="plan-card" style="padding: 16px;">
                <label>Plan Name<input id="plan-name-${p.id}" value="${esc(p.name)}"></label>
                <label>Price (₹)<input id="plan-price-${p.id}" type="number" value="${p.price}"></label>
                <button class="primary" onclick="savePlanConfig('${p.id}')">Save Plan Config</button>
              </div>
            `).join('')}
          </div>
        </div>
      </section>`;
    }
    function approvePayment(reqId) {
      const req = (db.paymentRequests || []).find(r => r.id === reqId);
      if (!req) return;
      req.status = 'Approved';
      const nextExp = new Date();
      nextExp.setDate(nextExp.getDate() + 30);
      db.subscription.activePlan = req.planName;
      db.subscription.status = 'active';
      db.subscription.expiresAt = nextExp.toISOString();
      delete db.subscription.requestedPlan;
      save();
      toast(`Approved! ${req.planName} plan activated for 30 days.`);
      beep();
      renderSubscribers();
    }
    function rejectPayment(reqId) {
      const req = (db.paymentRequests || []).find(r => r.id === reqId);
      if (!req) return;
      req.status = 'Rejected';
      db.subscription.status = 'active';
      save();
      toast('Payment request rejected.');
      renderSubscribers();
    }
    function savePlanConfig(planId) {
      const plan = (db.plans || []).find(p => p.id === planId);
      if (!plan) return;
      const name = document.getElementById(`plan-name-${planId}`).value.trim();
      const price = Number(document.getElementById(`plan-price-${planId}`).value) || 0;
      if (name) plan.name = name;
      plan.price = price;
      save();
      toast(`${plan.name} configuration saved.`);
      renderSubscribers();
    }
    function receiptHtml(o) {
      const s = db.settings || {};
      const name = esc(s.hotelName || 'Teddy Software Demo Store');
      const address = s.address ? `<p class="receipt-sub">${esc(s.address)}</p>` : '';
      const phone = s.phone ? `<p class="receipt-sub">Ph: ${esc(s.phone)}</p>` : '';
      const gst = s.gst ? `<p class="receipt-sub">GSTIN: ${esc(s.gst)}</p>` : '';
      const footer = esc(s.receiptFooter || 'Thank you for shopping with Teddy Software POS!');
      return `<div class="receipt"><div class="receipt-logo"><div><b>teddy</b><span>software</span></div></div><div class="receipt-title"><h2>${name}</h2>${address}${phone}${gst}<p style="margin-top:6px;font-weight:bold;">Bill Receipt</p></div><div class="receipt-meta"><div><span>Date & time</span><b>${time(o.createdAt)}</b></div><div><span>Order</span><b>${o.orderNo}</b></div><div><span>Token</span><b>${o.token}</b></div><div><span>Table / Type</span><b>${esc(o.tableName||o.type)}</b></div><div><span>Payment</span><b>${esc(o.payment)}</b></div></div><table><thead><tr><th>Item</th><th>Qty</th><th>Total</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')}</tbody></table><div><p>Subtotal: ${money(o.subtotal)}</p><p>GST (${s.tax || 0}%): ${money(o.tax)}</p></div><div class="receipt-total"><span>Total</span><b>${money(o.total)}</b></div><p class="receipt-thanks">${footer}</p></div>`;
    }
    function printKot(o, autoClose = false) {
      if (!o) return;
      billPreview = null;
      const div = document.createElement('div');
      div.className = 'modal kot-print-modal';
      div.innerHTML = `<div class="modal-card"><div class="modal-head"><div><p class="eyebrow">Kitchen copy</p><h2>KOT Token ${o.token}</h2></div><button class="ghost" onclick="this.closest('.modal').remove()">Close</button></div><div class="receipt"><div class="receipt-logo"><div><b>teddy</b><span>software</span></div></div><h2>TEDDY SOFTWARE KOT</h2><p>${esc(o.tableName||o.type)}</p><p>${time(o.createdAt)}</p><table>${o.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td></tr>`).join('')}</table></div><div class="actions"><button class="primary" onclick="window.print()">Print KOT</button></div></div>`;
      document.body.appendChild(div);
      setTimeout(()=>window.print(), 150);
      if (autoClose) setTimeout(() => div.remove(), 1200);
    }
    function renderSettings() {
      const ws = document.getElementById('workspace');
      const s = db.settings || {};
      ws.innerHTML = `<section class="panel">
        <div class="section-head"><div><p class="eyebrow">Business Profile & System Config</p><h2>Teddy Software POS Settings</h2><small style="color:var(--muted)">Configure business name, address, tax details, currency, invoice prefix, and receipts.</small></div><button class="primary" onclick="saveSettingsFromForm()">Save All Settings</button></div>
        <form class="inventory-form" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px;" onsubmit="event.preventDefault(); saveSettingsFromForm();">
          <label>Business / Store Name<input id="setHotelName" value="${esc(s.hotelName || '')}" placeholder="Teddy Software Demo Store"></label>
          <label>Phone / Contact Number<input id="setPhone" value="${esc(s.phone || '')}" placeholder="+91 98765 43210"></label>
          <label>Address<input id="setAddress" value="${esc(s.address || '')}" placeholder="123 Commercial Street, City"></label>
          <label>Email Address<input id="setEmail" value="${esc(s.email || '')}" placeholder="support@teddysoftware.com"></label>
          <label>Website<input id="setWebsite" value="${esc(s.website || '')}" placeholder="www.teddysoftware.com"></label>
          <label>GST / Tax Identification No.<input id="setGst" value="${esc(s.gst || '')}" placeholder="33AAAAA0000A1Z5"></label>
          <label>Tax Rate (%)<input id="setTax" type="number" step="0.1" value="${s.tax !== undefined ? s.tax : 5}"></label>
          <label>Currency Symbol<input id="setCurrency" value="${esc(s.currency || '₹')}" placeholder="₹"></label>
          <label>Invoice / Order Prefix<input id="setInvoicePrefix" value="${esc(s.invoicePrefix || 'TEDDY-')}" placeholder="TEDDY-"></label>
          <label>Receipt Footer Message<input id="setReceiptFooter" value="${esc(s.receiptFooter || '')}" placeholder="Thank you for shopping with Teddy Software POS!"></label>
          <label>Wi-Fi Display Name<input id="setWifiName" value="${esc(s.wifi || 'Teddy POS Wi-Fi')}" placeholder="Teddy POS Wi-Fi"></label>
          <div style="grid-column: 1 / -1; margin-top: 10px;">
            <button class="primary" type="submit" style="min-width: 200px;">Save All Settings</button>
          </div>
        </form>
      </section>`;
    }
    function saveSettingsFromForm() {
      db.settings ||= {};
      db.settings.hotelName = document.getElementById('setHotelName').value.trim() || 'Teddy Software Demo Store';
      db.settings.phone = document.getElementById('setPhone').value.trim();
      db.settings.address = document.getElementById('setAddress').value.trim();
      db.settings.email = document.getElementById('setEmail').value.trim();
      db.settings.website = document.getElementById('setWebsite').value.trim();
      db.settings.gst = document.getElementById('setGst').value.trim();
      db.settings.tax = Number(document.getElementById('setTax').value) || 0;
      db.settings.currency = document.getElementById('setCurrency').value.trim() || '₹';
      db.settings.invoicePrefix = document.getElementById('setInvoicePrefix').value.trim() || 'TEDDY-';
      db.settings.receiptFooter = document.getElementById('setReceiptFooter').value.trim() || 'Thank you for shopping with Teddy Software POS!';
      db.settings.wifi = document.getElementById('setWifiName').value.trim() || 'Teddy POS Wi-Fi';
      save();
      toast('Business Profile & POS Settings saved.');
      renderSettings();
    }
    function getPrinter(type) {
      normalizeDb();
      return db.printers.find(p => p.type === type) || db.printers[0];
    }
    function printerStatus(p) {
      if (p.status === 'online') return { cls: '', label: 'Online' };
      if (p.ip) return { cls: 'saved', label: 'Saved' };
      return { cls: 'offline', label: 'Offline' };
    }
    function printerCard(type, title, subtitle) {
      const p = getPrinter(type);
      const s = printerStatus(p);
      return `<article class="wifi-printer">
        <div class="wifi-printer-head">
          <div><strong>${title}</strong><small>${subtitle}</small></div>
          <span class="wifi-status ${s.cls}"><i class="wifi-dot"></i>${s.label}</span>
        </div>
        <div class="wifi-printer-form">
          <label>Printer IP address<input id="printer-${type}-ip" value="${esc(p.ip)}" placeholder="192.168.1.50" inputmode="numeric"></label>
          <label>Port<input id="printer-${type}-port" value="${esc(p.port || '9100')}" placeholder="9100" inputmode="numeric"></label>
        </div>
        <div class="wifi-printer-actions">
          <button onclick="savePrinterFromModal('${type}')">Save Printer</button>
          <button onclick="testPrinterConnection('${type}')">Test / Reconnect</button>
        </div>
        <small>${p.lastChecked ? 'Last checked: ' + time(p.lastChecked) : 'Not tested yet'}</small>
      </article>`;
    }
    function wifiDeviceCard(title, detail, isConnected, helper) {
      return `<article class="wifi-device">
        <div class="wifi-device-head">
          <div><strong>${title}</strong><small>${detail}</small></div>
          <span class="wifi-status ${isConnected ? '' : 'offline'}"><i class="wifi-dot"></i>${isConnected ? 'Connected' : 'Waiting'}</span>
        </div>
        <small>${helper}</small>
      </article>`;
    }
    function wifiSettingsHtml() {
      const isOnline = navigator.onLine;
      const isFile = location.protocol === 'file:';
      const here = isFile ? 'Standalone HTML file on this device' : location.origin + '/';
      const phone = 'http://YOUR-LAPTOP-WIFI-IP:4000/';
      const networkType = navigator.connection?.effectiveType ? navigator.connection.effectiveType.toUpperCase() : 'Browser network';
      const activeRole = user ? `${cap(user.role)} - ${user.name}` : 'Not logged in';
      return `<div class="wifi-hero">
        <div>
          <p class="eyebrow">Teddy Software Wi-Fi settings</p>
          <h2>${isOnline ? 'Network connected' : 'Network offline'}</h2>
          <p>${esc(db.settings.wifi)} - ${networkType}. Manage billing laptop, kitchen display, and thermal printer connections from one place.</p>
        </div>
        <div class="wifi-radar ${isOnline ? '' : 'offline'}">${isOnline ? 'ON' : 'OFF'}</div>
      </div>

      <div class="wifi-grid">
        ${wifiDeviceCard('This device', activeRole, isOnline, isFile ? 'You are using direct HTML mode on this device.' : 'This browser is connected to the POS server address.')}
        ${wifiDeviceCard('Billing laptop', 'Counter device', isOnline && user?.role !== 'kitchen', 'Login as Admin or Staff on the billing laptop for billing and print preview.')}
        ${wifiDeviceCard('Kitchen display', 'KOT phone/tablet', isOnline && user?.role === 'kitchen', 'Login as Kitchen on the phone/tablet to view KOT orders.')}
        ${wifiDeviceCard('Owner device', 'Reports and alerts', isOnline && user?.role === 'admin', 'Owner/Admin can view reports, menu, inventory, tables, and printer settings.')}
      </div>

      <article class="wifi-help">
        <b>POS Wi-Fi display name</b>
        <span>Enter your router or hotspot name so staff can quickly identify the correct network.</span>
        <div class="wifi-printer-form">
          <label>Wi-Fi name<input id="wifiNameInput" value="${esc(db.settings.wifi)}" placeholder="Teddy POS Wi-Fi"></label>
          <button onclick="saveWifiNameFromModal()">Save</button>
        </div>
      </article>

      <div class="wifi-grid">
        ${printerCard('billing', 'Billing Printer', 'Billing receipt printer')}
        ${printerCard('kot', 'Kitchen KOT Printer', 'Kitchen order ticket printer')}
      </div>

      <div class="wifi-grid">
        <article class="wifi-help">
          <b>Open on this laptop</b>
          <span>Use this address for the current POS screen.</span>
          <code>${here}</code>
        </article>
        <article class="wifi-help">
          <b>Open on phone or kitchen tablet</b>
          <span>For real multi-device Wi-Fi, run the POS server and open the laptop Wi-Fi IP address on the phone/tablet.</span>
          <code>${phone}</code>
        </article>
      </div>

      <div class="wifi-note">Note: Chrome cannot directly scan Wi-Fi names or thermal printer hardware from a standalone HTML file. Save the printer IP here for clear setup; real online/offline printer checking needs the Node/backend printer service.</div>`;
    }
    function wifiModalContentHtml() {
      return `<div class="modal-head">
        <div><p class="eyebrow">Connection center</p><h2>Wi-Fi, devices and printers</h2></div>
        <button class="ghost" onclick="this.closest('.modal').remove()">Close</button>
      </div>${wifiSettingsHtml()}`;
    }
    function refreshWifiModal() {
      const body = document.getElementById('wifi-modal-content');
      if (body) body.innerHTML = wifiModalContentHtml();
    }
    function saveWifiNameFromModal() {
      db.settings.wifi = document.getElementById('wifiNameInput').value.trim() || 'Teddy POS Wi-Fi';
      save();
      toast('Wi-Fi display name saved.');
      refreshWifiModal();
      render();
    }
    function savePrinterFromModal(type) {
      const p = getPrinter(type);
      p.ip = document.getElementById(`printer-${type}-ip`).value.trim();
      p.port = document.getElementById(`printer-${type}-port`).value.trim() || '9100';
      p.status = p.ip ? 'saved' : 'offline';
      p.lastChecked = new Date().toISOString();
      save();
      toast(p.ip ? `${p.name} saved. Press Test / Reconnect to mark ready.` : `${p.name} set offline. Add printer IP.`);
      refreshWifiModal();
    }
    function testPrinterConnection(type) {
      const p = getPrinter(type);
      p.ip = document.getElementById(`printer-${type}-ip`).value.trim();
      p.port = document.getElementById(`printer-${type}-port`).value.trim() || '9100';
      p.lastChecked = new Date().toISOString();
      if (!p.ip) {
        p.status = 'offline';
        save();
        toast(`Add ${p.name} IP address first.`);
        refreshWifiModal();
        return;
      }
      p.status = navigator.onLine ? 'online' : 'offline';
      save();
      if (p.status === 'online') {
        beep();
        toast(`${p.name} ready at ${p.ip}:${p.port}.`);
      } else {
        toast(`${p.name} offline. Check Wi-Fi and printer power.`);
      }
      refreshWifiModal();
    }
    function showConnect() {
      const old = document.getElementById('wifiConnectionModal');
      if (old) old.remove();
      const div = document.createElement('div');
      div.className = 'modal';
      div.id = 'wifiConnectionModal';
      div.innerHTML = `<div class="modal-card wifi-modal">
        <div id="wifi-modal-content" class="wifi-modal-body">${wifiModalContentHtml()}</div>
      </div>`;
      document.body.appendChild(div);
    }
    function cap(s) { return (s||'').slice(0,1).toUpperCase() + (s||'').slice(1); }
    function esc(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    async function boot() {
      try {
        await migrateMenuImagesToIndexedDb();
        await loadMenuImages();
      } catch (error) {
        console.warn(error);
        toast('Photo storage could not be prepared. Try Chrome if photos do not save.');
      }
      
      // Initialize Supabase Auth Real-time Session Listener
      if (window.TeddyAuth) {
        window.TeddyAuth.initSessionListener((event, session, profile) => {
          if (session && session.user) {
            const roleName = profile?.role === 'admin' || profile?.role === 'owner' ? 'Owner Admin' : profile?.role === 'staff' ? 'Billing Staff' : 'Kitchen Display';
            user = {
              id: session.user.id,
              name: profile?.full_name || session.user.email.split('@')[0],
              role: profile?.role || 'admin',
              username: session.user.email.split('@')[0],
              email: session.user.email,
              businessId: profile?.business_id
            };
            sessionStorage.setItem('teddy-user', JSON.stringify(user));
          }
          render();
        });
      }
      render();
    }
    boot();
  </script>
</body>
</html>
